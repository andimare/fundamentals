<!DOCTYPE html>
<html lang="en">
<head>

<body class="bg-gray-100 p-8">

            <template v-for="product in products" :key="id">
                <div class="bg-white rounded-lg shadow-md p-6 w-64 transform transition-transform hover:-translate-y-2">

                        <div class="flex items-center space-x-2 border rounded-lg overflow-hidden">
                            <button class="px-3 py-1 bg-gray-100 hover:bg-gray-200 text-gray-600" @click="product.request_no--">-</button>
                            <span class="px-3 py-1">{{ product.request_no }}</span>
                            <button class="px-3 py-1 bg-gray-100 hover:bg-gray-200 text-gray-600" @click="addQuantity(product.id)">+</button>
                        </div>
                        <button class="bg-blue-500 text-white px-2 py-1 rounded-lg hover:bg-blue-600 transition-colors">
                            + cart
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </div>

                ])

    </script>
</body>
</html>
